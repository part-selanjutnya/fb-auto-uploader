<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Moderasi Fanpage</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1877f2; font-size: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; margin-top: 0; }
        h2 { font-size: 16px; color: #333; margin-top: 25px; margin-bottom: 10px; }
        .stats { display: flex; gap: 10px; margin-bottom: 15px; }
        .card { flex: 1; background: #e7f3ff; padding: 12px; border-radius: 8px; border-left: 4px solid #1877f2; }
        .card h3 { margin: 0 0 5px 0; font-size: 12px; color: #555; }
        .card p { margin: 0; font-size: 15px; font-weight: bold; color: #1877f2; }
        
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; }
        th, td { border: 1px solid #e1e4e8; padding: 8px; text-align: left; vertical-align: middle; }
        th { background-color: #f6f8fa; font-weight: 600; }
        tr:nth-child(even) { background-color: #fafbfc; }
        
        .thumb-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #ddd; display: block; }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-success { background-color: #d4edda; color: #155724; }
        .badge-danger { background-color: #f8d7da; color: #721c24; }
        .badge-warning { background-color: #fff3cd; color: #856404; }
        .no-data { text-align: center; color: #777; padding: 15px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Fanpage</h1>
        <div class="stats">
            <div class="card">
                <h3>Terakhir Dicek</h3>
                <p id="last-check">-</p>
            </div>
            <div class="card">
                <h3>Total Dihapus</h3>
                <p id="total-deleted">0</p>
            </div>
        </div>

        <h2>Status 21 Fanpage</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">No</th>
                        <th>Nama Fanpage</th>
                        <th style="width: 110px;">Status</th>
                    </tr>
                </thead>
                <tbody id="pages-table-body">
                    <tr><td colspan="3" class="no-data">Memuat status...</td></tr>
                </tbody>
            </table>
        </div>

        <h2>Riwayat Penghapusan Video</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">Thumb</th>
                        <th>Waktu / Page / Judul</th>
                        <th style="width: 90px;">Status</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <tr><td colspan="3" class="no-data">Belum ada riwayat pelanggaran.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('report.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('last-check').textContent = data.last_check || '-';
                document.getElementById('total-deleted').textContent = data.total_deleted || 0;

                const pagesBody = document.getElementById('pages-table-body');
                pagesBody.innerHTML = '';
                if (data.pages_status && data.pages_status.length > 0) {
                    data.pages_status.forEach((page, index) => {
                        let badgeClass = 'badge-success';
                        if (page.badge === 'danger') badgeClass = 'badge-danger';
                        if (page.badge === 'warning') badgeClass = 'badge-warning';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td><strong>${page.name}</strong></td>
                            <td><span class="badge ${badgeClass}">${page.status}</span></td>
                        `;
                        pagesBody.appendChild(tr);
                    });
                } else {
                    pagesBody.innerHTML = '<tr><td colspan="3" class="no-data">Belum ada data.</td></tr>';
                }

                const logBody = document.getElementById('log-table-body');
                logBody.innerHTML = '';
                if (data.logs && data.logs.length > 0) {
                    data.logs.forEach(log => {
                        let thumbHtml = log.thumbnail ? `<img src="${log.thumbnail}" class="thumb-img" alt="Thumb">` : `<div style="font-size:10px; color:#999; text-align:center;">No Image</div>`;
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${thumbHtml}</td>
                            <td>
                                <small style="color:#666;">${log.time} — <strong>${log.page}</strong></small><br>
                                <span style="font-size: 12px;">${log.title}</span>
                            </td>
                            <td><span style="color: red; font-size: 11px; font-weight: bold;">${log.status}</span></td>
                        `;
                        logBody.appendChild(tr);
                    });
                } else {
                    logBody.innerHTML = '<tr><td colspan="3" class="no-data">Semua halaman aman!</td></tr>';
                }
            })
            .catch(error => {
                document.getElementById('pages-table-body').innerHTML = '<tr><td colspan="3" class="no-data">Menunggu pembaruan skrip...</td></tr>';
                document.getElementById('log-table-body').innerHTML = '<tr><td colspan="3" class="no-data">Menunggu pembaruan skrip...</td></tr>';
            });
    </script>
</body>
</html>
