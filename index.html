<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Auto Uploader - PRO Edition</title>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --white: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: var(--white);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .title-area h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-pro {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-connected {
            background-color: rgba(46, 204, 113, 0.15);
            color: #27ae60;
        }

        .status-disconnected {
            background-color: rgba(231, 76, 60, 0.15);
            color: #c0392b;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #27ae60; transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c0392b; transform: translateY(-2px); }
        .btn-secondary { background: var(--secondary); color: white; }

        /* Tabs Styling */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: var(--light);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: var(--secondary);
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .tab-content.active {
            display: block;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: var(--secondary);
            font-weight: 600;
        }

        .video-thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #eee;
        }

        .video-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .video-details h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: var(--primary);
        }

        .video-details p {
            margin: 0;
            font-size: 13px;
            color: #7f8c8d;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-pending { background: #fff3cd; color: #856404; }
        .status-completed { background: #d4edda; color: #155724; }

        .action-cell {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 5px;
        }

        /* Loading Spinner Animation */
        .loader-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-uploading {
            background-color: #e67e22 !important;
            color: white !important;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.9;
        }

        /* Modal Settings & Edit */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #95a5a6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--secondary);
            font-size: 14px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .page-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-item input {
            width: auto;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .action-buttons { flex-wrap: wrap; width: 100%; }
            .btn { flex: 1; justify-content: center; }
            th:nth-child(3), td:nth-child(3) { display: none; } /* Sembunyikan status di mobile */
            .video-info { flex-direction: column; align-items: flex-start; }
            .action-cell { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Area -->
    <div class="header">
        <div class="title-area">
            <h1>🚀 FB Auto Uploader <span class="badge-pro">PRO Edition</span></h1>
            <div id="conn_status" class="status-indicator status-disconnected">
                <i class="fas fa-times-circle"></i> Token Belum Diatur
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="openSettings()">
                <i class="fas fa-cog"></i> Pengaturan
            </button>
            <button class="btn btn-success" onclick="syncTelegram()">
                <i class="fas fa-sync-alt"></i> Tarik Video Telegram
            </button>
        </div>
    </div>

    <!-- Tabs Navigation -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')" id="tab-btn-pending">
            <i class="fas fa-clipboard-list"></i> Antrean (<span id="count-pending">0</span>)
        </button>
        <button class="tab-btn" onclick="switchTab('completed')" id="tab-btn-completed">
            <i class="fas fa-check-square"></i> Selesai (<span id="count-completed">0</span>)
        </button>
    </div>

    <!-- Tab Pending -->
    <div id="tab-pending" class="tab-content active">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="50%">Detail Konten & Afiliasi</th>
                        <th width="15%">Status</th>
                        <th width="25%">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body-pending">
                    <tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tab Completed -->
    <div id="tab-completed" class="tab-content">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="50%">Detail Konten Selesai</th>
                        <th width="15%">Status</th>
                        <th width="25%">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body-completed">
                    <tr><td colspan="4" style="text-align: center;">Belum ada video yang selesai.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Pengaturan -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeSettings()">&times;</span>
        <h2><i class="fas fa-cogs"></i> Pengaturan Koneksi</h2>
        <p style="font-size: 13px; color: #7f8c8d; margin-top: -10px; margin-bottom: 20px;">
            Masukkan Token PAT GitHub dan nama Repositori (Format: username/repo)
        </p>
        <div class="form-group">
            <label>GitHub Personal Access Token (PAT):</label>
            <input type="password" id="gh_token" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <div class="form-group">
            <label>Nama Repositori:</label>
            <input type="text" id="gh_repo" placeholder="username/repo-name">
        </div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="saveSettings()">
            <i class="fas fa-save"></i> Simpan Pengaturan
        </button>
    </div>
</div>

<script>
    // Tab Switching Logic
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`tab-btn-${tabId}`).classList.add('active');
    }

    // Modal Logic
    function openSettings() {
        document.getElementById('gh_token').value = localStorage.getItem('gh_token') || '';
        document.getElementById('gh_repo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
        const token = document.getElementById('gh_token').value;
        const repo = document.getElementById('gh_repo').value;
        if(token && repo) {
            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_repo', repo);
            checkConnection();
            closeSettings();
        } else {
            alert('Harap isi Token dan Repo!');
        }
    }

    // Check Connection & Render Status
    function checkConnection() {
        const token = localStorage.getItem('gh_token');
        const repo = localStorage.getItem('gh_repo');
        const statusEl = document.getElementById('conn_status');

        if(token && repo) {
            statusEl.className = 'status-indicator status-connected';
            statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Terhubung';
            loadData();
        } else {
            statusEl.className = 'status-indicator status-disconnected';
            statusEl.innerHTML = '<i class="fas fa-times-circle"></i> Token Belum Diatur';
        }
    }

    // Load Data JSON
    let videoData = [];
    function loadData() {
        const ts = new Date().getTime();
        fetch(`videos.json?t=${ts}`)
            .then(res => {
                if(!res.ok) throw new Error("File videos.json belum ada atau gagal dimuat");
                return res.json();
            })
            .then(data => {
                videoData = data;
                renderTables();
            })
            .catch(err => {
                document.getElementById('table-body-pending').innerHTML = `<tr><td colspan="4" style="text-align:center;color:red;">Error: ${err.message}</td></tr>`;
            });
    }

    // Render Data ke Table
    function renderTables() {
        const tbodyPending = document.getElementById('table-body-pending');
        const tbodyCompleted = document.getElementById('table-body-completed');
        
        let pendingHTML = '';
        let completedHTML = '';
        let countP = 0;
        let countC = 0;

        // Balikkan urutan agar video terbaru ada di atas
        const reversedData = [...videoData].reverse();

        reversedData.forEach(video => {
            const rowHTML = `
                <tr>
                    <td><strong>#${video.id}</strong></td>
                    <td>
                        <div class="video-info">
                            <img src="${video.thumbnail || 'https://via.placeholder.com/80?text=Video'}" class="video-thumbnail">
                            <div class="video-details">
                                <h3 style="color:#8e44ad;">${video.title}</h3>
                                <p><i class="fas fa-link"></i> ${video.redirect_link || 'Tidak ada link afiliasi'}</p>
                            </div>
                        </div>
                    </td>
                    <td><span class="status-badge status-${video.status}">${video.status.toUpperCase()}</span></td>
                    <td class="action-cell">
                        ${video.status === 'pending' ? `
                            <button class="btn btn-sm btn-primary" onclick="uploadInstant('${video.id}')" id="btn-up-${video.id}">
                                <i class="fas fa-rocket"></i> Upload
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteVideo('${video.id}')">
                                <i class="fas fa-trash"></i> Hapus
                            </button>
                        ` : `
                            <span style="color:#7f8c8d; font-size:12px;"><i class="fas fa-archive"></i> Arsip Selesai</span>
                        `}
                    </td>
                </tr>
            `;

            if(video.status === 'pending') {
                pendingHTML += rowHTML;
                countP++;
            } else {
                completedHTML += rowHTML;
                countC++;
            }
        });

        document.getElementById('count-pending').innerText = countP;
        document.getElementById('count-completed').innerText = countC;

        tbodyPending.innerHTML = pendingHTML || `<tr><td colspan="4" style="text-align: center;">Tidak ada antrean pending.</td></tr>`;
        tbodyCompleted.innerHTML = completedHTML || `<tr><td colspan="4" style="text-align: center;">Belum ada video selesai.</td></tr>`;
    }

    // Fungsi Upload Instant dengan Animasi Loading Real-Time
    function uploadInstant(videoId) {
        if (!confirm('Kirim perintah upload ke Facebook SEKARANG?')) return;

        const uploadBtn = document.getElementById(`btn-up-${videoId}`);
        const originalBtnText = uploadBtn.innerHTML;

        // Ubah tombol jadi Loading
        uploadBtn.innerHTML = '<span class="loader-spinner"></span> Mengunggah...';
        uploadBtn.classList.add('btn-uploading');

        const token = localStorage.getItem('gh_token');
        const repo = localStorage.getItem('gh_repo');

        if (!token || !repo) {
            alert('Pengaturan token belum lengkap!');
            resetButton(uploadBtn, originalBtnText);
            return;
        }

        const payload = {
            event_type: "upload_now",
            client_payload: { command: "upload_now", video_id: videoId }
        };

        fetch(`https://api.github.com/repos/${repo}/dispatches`, {
            method: 'POST',
            headers: {
                'Accept': 'application/vnd.github.v3+json',
                'Authorization': `token ${token}`
            },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (res.ok) {
                // Mulai polling untuk ngecek status di backend
                checkUploadStatus(videoId, uploadBtn, originalBtnText);
            } else {
                alert('Gagal memicu GitHub Actions. Periksa token.');
                resetButton(uploadBtn, originalBtnText);
            }
        })
        .catch(err => {
            alert('Error: ' + err);
            resetButton(uploadBtn, originalBtnText);
        });
    }

    // Fungsi Polling Pengecekan Status Backend
    function checkUploadStatus(videoId, uploadBtn, originalBtnText) {
        const maxAttempts = 24; // Cek selama 6 menit maksimal (24 x 15 detik)
        let attempts = 0;
        
        const checkInterval = setInterval(() => {
            attempts++;
            const ts = new Date().getTime();
            
            fetch(`videos.json?t=${ts}`)
                .then(res => res.json())
                .then(data => {
                    const targetVideo = data.find(v => String(v.id) === String(videoId));
                    
                    if (targetVideo && targetVideo.status === 'completed') {
                        // Jika backend sudah mengubah status jadi selesai
                        clearInterval(checkInterval);
                        uploadBtn.innerHTML = '<i class="fas fa-check"></i> Selesai';
                        uploadBtn.classList.remove('btn-uploading');
                        uploadBtn.style.backgroundColor = '#27ae60';
                        
                        // Reload data untuk memindahkan video ke tab Selesai
                        setTimeout(() => {
                            loadData(); 
                        }, 1500);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        uploadBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Timeout';
                        uploadBtn.classList.remove('btn-uploading');
                        uploadBtn.style.backgroundColor = '#e74c3c';
                        alert('Waktu tunggu habis (timeout). Silakan periksa tab Actions di GitHub Anda.');
                    }
                })
                .catch(err => console.error(err));
        }, 15000); // Polling tiap 15 detik
    }

    function resetButton(btnElement, originalText) {
        btnElement.innerHTML = originalText;
        btnElement.classList.remove('btn-uploading');
    }

    // Fungsi Tarik Video Telegram
    function syncTelegram() {
        const token = localStorage.getItem('gh_token');
        const repo = localStorage.getItem('gh_repo');
        if(!token || !repo) { alert('Isi Token & Repo dulu di Pengaturan!'); return; }

        if(!confirm('Tarik video terbaru dari Telegram Bot?')) return;

        const payload = {
            event_type: "sync_only",
            client_payload: { command: "sync_only" }
        };

        fetch(`https://api.github.com/repos/${repo}/dispatches`, {
            method: 'POST',
            headers: {
                'Accept': 'application/vnd.github.v3+json',
                'Authorization': `token ${token}`
            },
            body: JSON.stringify(payload)
        }).then(res => {
            if(res.ok) {
                alert('Perintah Sync Telegram dikirim! Muat ulang halaman ini dalam 15-30 detik.');
            } else {
                alert('Gagal mengirim perintah. Cek token.');
            }
        });
    }

    // Fungsi Hapus Video (Simulasi Frontend Sederhana)
    function deleteVideo(id) {
        if(confirm('Hapus video ini dari antrean? (Perlu pembaruan manual di backend)')) {
            alert('Fitur hapus di frontend aktif. Namun file JSON harus di-commit via GitHub Actions untuk hapus permanen.');
            // Secara lokal disembunyikan
            videoData = videoData.filter(v => String(v.id) !== String(id));
            renderTables();
        }
    }

    // Inisialisasi awal
    window.onload = function() {
        checkConnection();
    };
</script>

</body>
</html>
