<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Auto Uploader - PRO Edition</title>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --success: #2ecc71;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --white: #ffffff;
            --text: #2c3e50;
            
            --btn-edit: #3b82f6;      
            --btn-upload: #8b5cf6;    
            --btn-hapus: #ef4444;     
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .header {
            background: var(--white); padding: 20px; border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }

        .title-area h1 { margin: 0; font-size: 22px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .badge-pro { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }

        .status-indicator { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-top: 10px; }
        .status-connected { background-color: rgba(46, 204, 113, 0.15); color: #27ae60; }
        .status-disconnected { background-color: rgba(231, 76, 60, 0.15); color: #c0392b; }

        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; }
        .btn-green { background: #2ecc71; color: white; }
        .btn-green:hover { background: #27ae60; transform: translateY(-2px); }
        .btn-gray { background: #576574; color: white; }
        .btn-gray:hover { background: #485460; transform: translateY(-2px); }

        .btn-sm { padding: 8px 12px; font-size: 12px; border-radius: 6px; width: 100%; justify-content: center;}
        .btn-edit-action { background: var(--btn-edit); color: white; }
        .btn-upload-action { background: var(--btn-upload); color: white; }
        .btn-hapus-action { background: var(--btn-hapus); color: white; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; background: var(--light); border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; color: var(--secondary); transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
        th { background-color: #f8f9fa; color: var(--secondary); font-weight: 600; }

        .video-thumbnail { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .video-info { display: flex; align-items: flex-start; gap: 15px; cursor: pointer; padding: 5px; border-radius: 8px; transition: 0.2s; }
        .video-info:hover { background-color: #f8f9fa; }
        
        .video-details h3 { margin: 0 0 5px 0; font-size: 15px; color: #6c5ce7; line-height: 1.3;}
        .video-meta { font-size: 12px; margin-top: 5px; display: flex; align-items: center; gap: 5px; }
        .meta-status-pending { color: #e67e22; font-weight: bold;}
        .meta-status-completed { color: #27ae60; font-weight: bold;}
        .meta-desc { color: #3498db; background: rgba(52, 152, 219, 0.1); padding: 3px 8px; border-radius: 12px; display: inline-flex; width: fit-content;}

        .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-completed { background: #d4edda; color: #155724; }

        .action-cell { display: flex; flex-direction: column; gap: 8px; width: 100%; }

        /* Detail Tersembunyi (Accordion) */
        .full-desc-box { display: none; background: #f8f9fa; border-left: 4px solid #3498db; padding: 12px; margin-top: 12px; border-radius: 0 8px 8px 0; font-size: 13px; color: #2c3e50; line-height: 1.5; }

        /* Modal / Overlay */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); box-sizing: border-box; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #95a5a6; transition: 0.2s; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #34495e;}
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; background: #fff; }

        .flex-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .flex-buttons .btn { flex: 1; }

        /* Animasi Loading */
        .loader-spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; margin-right: 5px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-uploading { background-color: #f39c12 !important; color: white !important; cursor: not-allowed; pointer-events: none; }

        /* ======== RESPONSIVE LAYOUT UNTUK HP ======== */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .action-buttons { width: 100%; flex-direction: row; }
            .action-buttons .btn { flex: 1; padding: 12px; font-size: 13px; }
            
            /* Ubah Table jadi bentuk Card (Kartu) di HP */
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { display: none; }
            tr { background: #fff; border: 1px solid #e1e8ed; border-radius: 12px; margin-bottom: 15px; padding: 15px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
            td { padding: 0; border: none; margin-bottom: 10px; }
            
            /* Penyesuaian Elemen Dalam Card */
            td:nth-child(1) { font-size: 14px; color: #7f8c8d; border-bottom: 1px solid #f1f2f6; padding-bottom: 8px; margin-bottom: 12px; }
            td:nth-child(3) { position: absolute; top: 15px; right: 15px; margin: 0; }
            
            .video-info { padding: 0; }
            .action-cell { flex-direction: row; flex-wrap: wrap; margin-top: 15px; gap: 8px; border-top: 1px solid #f1f2f6; padding-top: 12px; }
            .action-cell .btn { flex: 1; min-width: 30%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="title-area">
            <h1>🚀 FB Auto Uploader <span class="badge-pro">PRO Edition</span></h1>
            <div id="conn_status" class="status-indicator status-disconnected">
                <i class="fas fa-times-circle"></i> Token Belum Diatur
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-green" onclick="syncTelegram()">
                <i class="fas fa-sync-alt"></i> Tarik Telegram
            </button>
            <button class="btn btn-gray" onclick="openSettings()">
                <i class="fas fa-cog"></i> Pengaturan
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')" id="tab-btn-pending">
            <i class="fas fa-clipboard-list"></i> Antrean (<span id="count-pending">0</span>)
        </button>
        <button class="tab-btn" onclick="switchTab('completed')" id="tab-btn-completed">
            <i class="fas fa-check-square"></i> Selesai (<span id="count-completed">0</span>)
        </button>
    </div>

    <!-- Tab Pending -->
    <div id="tab-pending" class="tab-content active">
        <table>
            <thead>
                <tr>
                    <th width="8%">ID</th>
                    <th width="52%">Detail Konten (Klik untuk buka)</th>
                    <th width="15%">Status</th>
                    <th width="25%">Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body-pending">
                <tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Tab Completed -->
    <div id="tab-completed" class="tab-content">
        <table>
            <thead>
                <tr>
                    <th width="8%">ID</th>
                    <th width="52%">Detail Konten Selesai</th>
                    <th width="15%">Status</th>
                    <th width="25%">Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body-completed">
                <tr><td colspan="4" style="text-align: center;">Belum ada video selesai.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ================= MODALS / OVERLAYS ================= -->

<!-- 1. Modal Upload & Jadwal -->
<div id="uploadModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('uploadModal')">&times;</span>
        <h2 style="color: var(--btn-upload); margin-top:0;"><i class="fas fa-rocket"></i> Atur Upload</h2>
        <input type="hidden" id="upload_video_id">
        <div class="form-group" style="margin-top: 15px;">
            <label><i class="fas fa-calendar-alt"></i> Setel Jadwal (Opsional):</label>
            <input type="datetime-local" id="schedule_time">
            <small style="color: #7f8c8d; font-size: 11px;">Biarkan kosong jika ingin upload sekarang.</small>
        </div>
        <div class="flex-buttons">
            <button class="btn btn-gray" onclick="saveSchedule()">
                <i class="fas fa-save"></i> Jadwalkan
            </button>
            <button class="btn btn-upload-action" onclick="triggerUploadNow()">
                <i class="fas fa-upload"></i> Upload Sekarang
            </button>
        </div>
    </div>
</div>

<!-- 2. Modal Edit Video dengan Pilihan Bot -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('editModal')">&times;</span>
        <h2 style="color: var(--btn-edit); margin-top:0;"><i class="fas fa-edit"></i> Edit Detail Video</h2>
        <input type="hidden" id="edit_video_id">
        
        <!-- Pilihan Mode AI / Manual -->
        <div class="form-group">
            <label><i class="fas fa-robot"></i> Pengaturan Pembuatan Konten:</label>
            <select id="edit_mode" onchange="toggleEditMode()" style="background: #f1f2f6; font-weight: bold; color: #2c3e50;">
                <option value="auto">🤖 Otomatis (Biarkan Bot Tulis Caption & Komen)</option>
                <option value="manual">✍️ Manual (Tulis Sendiri)</option>
            </select>
        </div>

        <!-- Area Input Manual (Bisa Disembunyikan) -->
        <div id="manual_input_area" style="display: none;">
            <div class="form-group">
                <label>Judul Video:</label>
                <input type="text" id="edit_title">
            </div>
            <div class="form-group">
                <label>Deskripsi / Caption:</label>
                <textarea id="edit_desc" rows="3"></textarea>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label><i class="fas fa-link"></i> Link Afiliasi (Shopee/TikTok):</label>
            <input type="text" id="edit_link" placeholder="https://s.shopee.co.id/...">
        </div>
        
        <button class="btn btn-edit-action" style="width: 100%; margin-top: 15px;" onclick="saveEdit()">
            <i class="fas fa-save"></i> Simpan Pengaturan
        </button>
    </div>
</div>

<!-- 3. Modal Settings -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('settingsModal')">&times;</span>
        <h2><i class="fas fa-cogs"></i> Pengaturan Sistem</h2>
        <div class="form-group">
            <label>GitHub PAT Token:</label>
            <input type="password" id="gh_token">
        </div>
        <div class="form-group">
            <label>Repositori (user/repo):</label>
            <input type="text" id="gh_repo">
        </div>
        <button class="btn btn-green" style="width: 100%;" onclick="saveSettings()">
            <i class="fas fa-save"></i> Simpan
        </button>
    </div>
</div>

<script>
    // System UI Functions
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`tab-btn-${tabId}`).classList.add('active');
    }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Dropdown Video Details (Klik Muncul Deskripsi)
    function toggleDesc(id) {
        const descBox = document.getElementById(`desc-${id}`);
        if(descBox.style.display === 'block') {
            descBox.style.display = 'none';
        } else {
            descBox.style.display = 'block';
        }
    }

    // Toggle Modal Edit (Auto/Manual)
    function toggleEditMode() {
        const mode = document.getElementById('edit_mode').value;
        const manualArea = document.getElementById('manual_input_area');
        if(mode === 'auto') {
            manualArea.style.display = 'none';
        } else {
            manualArea.style.display = 'block';
        }
    }

    // Settings API
    function openSettings() {
        document.getElementById('gh_token').value = localStorage.getItem('gh_token') || '';
        document.getElementById('gh_repo').value = localStorage.getItem('gh_repo') || '';
        openModal('settingsModal');
    }
    function saveSettings() {
        const t = document.getElementById('gh_token').value, r = document.getElementById('gh_repo').value;
        if(t && r) { localStorage.setItem('gh_token', t); localStorage.setItem('gh_repo', r); checkConnection(); closeModal('settingsModal'); } 
        else { alert('Isi Token dan Repo!'); }
    }
    function checkConnection() {
        const t = localStorage.getItem('gh_token'), r = localStorage.getItem('gh_repo');
        const st = document.getElementById('conn_status');
        if(t && r) { st.className = 'status-indicator status-connected'; st.innerHTML = '<i class="fas fa-check-circle"></i> Terhubung'; loadData(); } 
        else { st.className = 'status-indicator status-disconnected'; st.innerHTML = '<i class="fas fa-times-circle"></i> Token Belum Diatur'; }
    }

    // Load & Render Tables
    let videoData = [];
    function loadData() {
        fetch(`videos.json?t=${new Date().getTime()}`)
            .then(res => res.json())
            .then(data => { videoData = data; renderTables(); })
            .catch(err => console.error(err));
    }

    function renderTables() {
        let pHTML = '', cHTML = '';
        let countP = 0, countC = 0;

        [...videoData].reverse().forEach(video => {
            const isPending = video.status === 'pending';
            const statusIcon = isPending ? `<div class="video-meta meta-status-pending"><i class="fas fa-clock"></i> Status: Otomatis</div>` 
                                         : `<div class="video-meta meta-status-completed"><i class="fas fa-check-square"></i> Terunggah ke Facebook</div>`;
            
            const badge = `<span class="status-badge badge-${video.status}">${isPending ? 'Pending' : 'Selesai'}</span>`;

            const rowHTML = `
                <tr>
                    <td><strong>#${video.id}</strong></td>
                    <td>
                        <!-- Area Klik Untuk Buka Deskripsi -->
                        <div class="video-info" onclick="toggleDesc('${video.id}')">
                            <img src="${video.thumbnail || 'https://via.placeholder.com/80?text=Video'}" class="video-thumbnail">
                            <div class="video-details">
                                <h3>${video.title || 'Video Tanpa Judul'}</h3>
                                ${statusIcon}
                                <div class="video-meta meta-desc"><i class="fas fa-chevron-down"></i> Klik lihat deskripsi lengkap</div>
                            </div>
                        </div>
                        <!-- Kotak Deskripsi Tersembunyi -->
                        <div id="desc-${video.id}" class="full-desc-box">
                            <strong>Caption / Deskripsi:</strong><br>
                            ${video.description ? video.description.replace(/\\n/g, '<br>') : 'Bot akan mengisi otomatis.'}
                            <br><br><strong>Link Afiliasi Terpasang:</strong><br>
                            <a href="${video.redirect_link || '#'}" target="_blank" style="color:#e67e22;">${video.redirect_link || 'Tidak ada link'}</a>
                        </div>
                    </td>
                    <td>${badge}</td>
                    <td>
                        <div class="action-cell">
                        ${isPending ? `
                            <button class="btn btn-sm btn-edit-action" onclick="openEditVideo('${video.id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn btn-sm btn-upload-action" onclick="openUploadVideo('${video.id}')" id="btn-up-${video.id}"><i class="fas fa-upload"></i> Upload</button>
                            <button class="btn btn-sm btn-hapus-action" onclick="deleteVideo('${video.id}')"><i class="fas fa-trash"></i> Hapus</button>
                        ` : `<span style="color:#7f8c8d; font-size:12px; display:block; text-align:center;"><i class="fas fa-archive"></i> Arsip Selesai</span>`}
                        </div>
                    </td>
                </tr>
            `;

            if(isPending) { pHTML += rowHTML; countP++; } else { cHTML += rowHTML; countC++; }
        });

        document.getElementById('count-pending').innerText = countP;
        document.getElementById('count-completed').innerText = countC;
        document.getElementById('table-body-pending').innerHTML = pHTML || `<tr><td colspan="4" align="center">Antrean kosong.</td></tr>`;
        document.getElementById('table-body-completed').innerHTML = cHTML || `<tr><td colspan="4" align="center">Belum ada video selesai.</td></tr>`;
    }

    // Aksi Edit
    function openEditVideo(id) {
        const vid = videoData.find(v => String(v.id) === String(id));
        if(vid) {
            document.getElementById('edit_video_id').value = vid.id;
            document.getElementById('edit_title').value = vid.title || '';
            document.getElementById('edit_desc').value = vid.description || '';
            document.getElementById('edit_link').value = vid.redirect_link || '';
            
            // Setel dropdown ke Manual secara default supaya text area terlihat, atau auto jika kosong
            const modeDrop = document.getElementById('edit_mode');
            if(vid.description && vid.description.trim() !== '') {
                modeDrop.value = 'manual';
            } else {
                modeDrop.value = 'auto';
            }
            toggleEditMode(); // Jalankan tampilan
            
            openModal('editModal');
        }
    }

    function saveEdit() {
        const mode = document.getElementById('edit_mode').value;
        const note = mode === 'auto' ? "\n\n(Catatan: Bot akan otomatis membuatkan caption & pancingan karena Anda memilih mode Otomatis!)" : "";
        alert('Pengaturan Konten Disimpan!' + note);
        closeModal('editModal');
    }

    // Aksi Upload
    function openUploadVideo(id) {
        document.getElementById('upload_video_id').value = id;
        document.getElementById('schedule_time').value = '';
        openModal('uploadModal');
    }

    function triggerUploadNow() {
        const videoId = document.getElementById('upload_video_id').value;
        closeModal('uploadModal');
        const uploadBtn = document.getElementById(`btn-up-${videoId}`);
        const originalText = uploadBtn.innerHTML;

        uploadBtn.innerHTML = '<span class="loader-spinner"></span> Memproses...';
        uploadBtn.classList.add('btn-uploading');

        const t = localStorage.getItem('gh_token'), r = localStorage.getItem('gh_repo');
        fetch(`https://api.github.com/repos/${r}/dispatches`, {
            method: 'POST',
            headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${t}` },
            body: JSON.stringify({ event_type: "upload_now", client_payload: { command: "upload_now", video_id: videoId } })
        }).then(res => {
            if(res.ok) checkUploadStatus(videoId, uploadBtn, originalText);
            else { alert('Gagal mengirim perintah. Cek token/repo.'); uploadBtn.innerHTML = originalText; uploadBtn.classList.remove('btn-uploading'); }
        });
    }

    function checkUploadStatus(id, btn, text) {
        const interval = setInterval(() => {
            fetch(`videos.json?t=${new Date().getTime()}`).then(res => res.json()).then(data => {
                const vid = data.find(v => String(v.id) === String(id));
                if(vid && vid.status === 'completed') {
                    clearInterval(interval);
                    btn.innerHTML = '✅ Selesai'; btn.classList.remove('btn-uploading'); btn.style.background = '#27ae60';
                    setTimeout(loadData, 1500);
                }
            });
        }, 15000);
    }

    function syncTelegram() { if(confirm('Tarik video dari Telegram?')) alert('Mensinkronkan... muat ulang sebentar lagi.'); }
    function deleteVideo(id) { if(confirm('Hapus video ini?')) { videoData = videoData.filter(v => String(v.id) !== String(id)); renderTables(); } }
    function saveSchedule() { alert('Jadwal tersimpan!'); closeModal('uploadModal'); }

    window.onload = checkConnection;
</script>

</body>
</html>
