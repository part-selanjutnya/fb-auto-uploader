<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor FB Auto Uploader - CEO Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 24px; color: #2c3e50; }
        .btn-sync { background: #27ae60; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-sync:hover { background: #219150; }
        .btn-edit { background: #3498db; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #2c3e50; color: #fff; }
        tr:hover { background: #f1f1f1; }
        .status-pending { color: #e67e22; font-weight: bold; }
        .status-completed { color: #27ae60; font-weight: bold; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 10px; width: 450px; max-width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        textarea, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        .radio-group { margin-bottom: 15px; display: flex; gap: 15px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-save { background: #e74c3c; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-cancel { background: #95a5a6; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-reset { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; margin-top: 5px;}
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>🚀 Dasbor Antrean Video Afiliasi</h1>
            <button class="btn-reset" onclick="resetToken()">Reset Token Akses</button>
        </div>
        <button class="btn-sync" onclick="triggerTelegramSync()">🔄 Tarik Video dari Telegram Sekarang</button>
    </div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Judul Video</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="video-list">
                <tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- OVERLAY BOX (MODAL) -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>⚙️ Konfigurasi Video & Afiliasi</h3>
            
            <div class="radio-group">
                <label><input type="radio" name="editMode" id="modeOtomatis" value="auto" onchange="toggleMode()"> 🤖 Mode Otomatis</label>
                <label><input type="radio" name="editMode" id="modeManual" value="manual" onchange="toggleMode()" checked> ✍️ Mode Manual</label>
            </div>

            <div class="form-group">
                <label>Deskripsi / Caption Facebook:</label>
                <textarea id="modalDesc" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label>Komentar Pancingan (Disematkan):</label>
                <textarea id="modalComment" rows="2"></textarea>
            </div>

            <div class="form-group">
                <label>Link Redirect / Afiliasi (Shopee/TikTok):</label>
                <input type="text" id="modalLink" placeholder="https://shopee.co.id/...">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-save" onclick="saveVideoEdit()">💾 Simpan & Update</button>
            </div>
        </div>
    </div>

    <script>
        // Variabel global agar bisa diakses semua fungsi
        window.currentEditingVideoId = null;
        const REPO_OWNER = 'part-selanjutnya'; 
        const REPO_NAME = 'fb-auto-uploader';

        // Fungsi Memuat Data
        async function loadVideos() {
            const tbody = document.getElementById('video-list');
            try {
                // Gunakan URL mentah jika file berada di root (tambahkan random untuk menghindari cache)
                const cacheBuster = new Date().getTime();
                const response = await fetch('videos.json?t=' + cacheBuster);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const videos = await response.json();
                
                if (!Array.isArray(videos) || videos.length === 0) {
                     tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada video di antrean</td></tr>';
                     return;
                }

                tbody.innerHTML = '';
                videos.forEach(video => {
                    const statusClass = video.status === 'pending' ? 'status-pending' : 'status-completed';
                    const statusText = video.status === 'pending' ? 'Menunggu Antrean (Pending)' : 'Selesai Terunggah';
                    
                    const desc = video.description ? video.description.replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, "\\n") : '';
                    const comment = video.comment_text ? video.comment_text.replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, "\\n") : '';
                    const link = video.redirect_link ? video.redirect_link.replace(/'/g, "&#39;").replace(/"/g, "&quot;") : '';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${video.id}</td>
                        <td>${video.title || 'Tanpa Judul'}</td>
                        <td class="${statusClass}">${statusText}</td>
                        <td>
                            ${video.status === 'pending' 
                                ? \`<button class="btn-edit" onclick="openEditModal(\${video.id}, '\${desc}', '\${comment}', '\${link}')">✏️ Edit Afiliasi</button>\` 
                                : '<span>-</span>'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Fetch error:", error);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Gagal memuat videos.json (Pastikan file tidak kosong dan berformat JSON valid)</td></tr>';
            }
        }

        // Fungsi Tombol Sinkronisasi
        window.triggerTelegramSync = function() {
            let token = localStorage.getItem('github_pat');
            if (!token) {
                token = prompt("🔒 Masukkan GitHub Personal Access Token (PAT) Anda:\\n(Harus berawalan ghp_...)");
                if (!token) return;
                localStorage.setItem('github_pat', token);
            }

            if(!confirm("Tarik video terbaru dari Telegram sekarang?")) return;
            
            fetch(\`https://api.github.com/repos/\${REPO_OWNER}/\${REPO_NAME}/dispatches\`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': \`token \${token}\`
                },
                body: JSON.stringify({ event_type: 'instant_upload' })
            })
            .then(res => {
                if(res.ok) {
                    alert('✅ Sukses! Perintah ditarik. Tunggu 1 menit lalu refresh halaman.');
                } else {
                    if (res.status === 401 || res.status === 403) {
                        alert('❌ Token salah atau kadaluarsa. Silakan Reset Token.');
                        localStorage.removeItem('github_pat');
                    } else {
                        alert('❌ Gagal. Status: ' + res.status);
                    }
                }
            })
            .catch(err => {
                console.error(err);
                alert('❌ Terjadi kesalahan jaringan.');
            });
        };

        // Fungsi Modal & Form
        window.resetToken = function() {
            localStorage.removeItem('github_pat');
            alert("Token dihapus. Klik tombol Tarik Video untuk memasukkan token baru.");
        };

        window.openEditModal = function(id, desc, comment, link) {
            window.currentEditingVideoId = id;
            document.getElementById('editModal').style.display = 'flex';
            document.getElementById('modeManual').checked = true;
            document.getElementById('modalDesc').value = (desc !== 'undefined') ? desc.replace(/\\n/g, '\\n') : '';
            document.getElementById('modalComment').value = (comment !== 'undefined') ? comment.replace(/\\n/g, '\\n') : '';
            document.getElementById('modalLink').value = (link !== 'undefined') ? link : '';
            window.toggleMode();
        };

        window.closeModal = function() {
            document.getElementById('editModal').style.display = 'none';
        };

        window.toggleMode = function() {
            const isAuto = document.getElementById('modeOtomatis').checked;
            const descField = document.getElementById('modalDesc');
            const commentField = document.getElementById('modalComment');
            
            if (isAuto) {
                descField.value = "🔥 Part terbaru nih guys! Makin seru aja ceritanya.\\n\\n#alurcerita #filmseru";
                commentField.value = "👇 Lanjutannya dan barang di video ada di link ini ya:";
                descField.readOnly = true;
                commentField.readOnly = true;
                descField.style.background = "#f0f0f0";
                commentField.style.background = "#f0f0f0";
            } else {
                descField.readOnly = false;
                commentField.readOnly = false;
                descField.style.background = "#fff";
                commentField.style.background = "#fff";
            }
        };

        window.saveVideoEdit = function() {
            alert("Catatan: Mode web statis. Perlu konfigurasi Actions lebih lanjut untuk menyimpan perubahan permanen ke GitHub.");
            window.closeModal();
        };

        // Mulai memuat data saat halaman siap
        window.addEventListener('DOMContentLoaded', loadVideos);
    </script>
</body>
</html>
