<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Auto Uploader - PRO Edition</title>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --success: #2ecc71;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --white: #ffffff;
            --text: #2c3e50;
            
            /* Warna Tombol Kustom sesuai desain Anda */
            --btn-edit: #3b82f6;      /* Biru */
            --btn-upload: #8b5cf6;    /* Ungu */
            --btn-hapus: #ef4444;     /* Merah */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .header {
            background: var(--white);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .title-area h1 {
            margin: 0; font-size: 24px; color: var(--primary);
            display: flex; align-items: center; gap: 10px;
        }

        .badge-pro {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: bold;
        }

        .status-indicator {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 12px; border-radius: 20px;
            font-size: 14px; font-weight: 600; margin-top: 10px;
        }

        .status-connected { background-color: rgba(46, 204, 113, 0.15); color: #27ae60; }
        .status-disconnected { background-color: rgba(231, 76, 60, 0.15); color: #c0392b; }

        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }

        .btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-green { background: #2ecc71; color: white; }
        .btn-green:hover { background: #27ae60; transform: translateY(-2px); }
        .btn-gray { background: #576574; color: white; }
        .btn-gray:hover { background: #485460; transform: translateY(-2px); }

        /* Tombol Tabel */
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; width: 100%; justify-content: flex-start;}
        .btn-edit-action { background: var(--btn-edit); color: white; }
        .btn-upload-action { background: var(--btn-upload); color: white; }
        .btn-hapus-action { background: var(--btn-hapus); color: white; }

        /* Tabs Styling */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 15px; text-align: center;
            background: var(--light); border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            color: var(--secondary); transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--primary); color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tab-content { display: none; background: white; padding: 20px; border-radius: 15px; }
        .tab-content.active { display: block; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top;}
        th { background-color: #f8f9fa; color: var(--secondary); font-weight: 600; }

        .video-thumbnail { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .video-info { display: flex; align-items: flex-start; gap: 15px; }
        
        .video-details h3 { margin: 0 0 5px 0; font-size: 16px; color: #6c5ce7; }
        .video-meta { font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
        .meta-status-pending { color: #e67e22; }
        .meta-status-completed { color: #27ae60; font-weight: bold;}
        .meta-desc { color: #7f8c8d; }

        .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .badge-pending { color: #e67e22; font-weight: bold; }
        .badge-completed { color: #27ae60; font-weight: bold; }

        .action-cell { display: flex; flex-direction: column; gap: 8px; width: 100%; }

        /* Modal / Overlay */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 15px;
            width: 90%; max-width: 450px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .close-modal {
            position: absolute; top: 15px; right: 20px; font-size: 24px;
            cursor: pointer; color: #95a5a6; transition: 0.2s;
        }
        .close-modal:hover { color: #e74c3c; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #34495e;}
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
            box-sizing: border-box; font-family: inherit; font-size: 14px;
        }

        .flex-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .flex-buttons .btn { flex: 1; }

        /* Animasi Loading */
        .loader-spinner {
            border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white;
            border-radius: 50%; width: 14px; height: 14px;
            animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .btn-uploading {
            background-color: #f39c12 !important; color: white !important;
            cursor: not-allowed; pointer-events: none; justify-content: center;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .action-buttons { flex-wrap: wrap; width: 100%; }
            .btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="title-area">
            <h1>🚀 FB Auto Uploader <span class="badge-pro">PRO Edition</span></h1>
            <div id="conn_status" class="status-indicator status-disconnected">
                <i class="fas fa-times-circle"></i> Token Belum Diatur
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-green" onclick="syncTelegram()">
                <i class="fas fa-sync-alt"></i> Tarik Video Telegram
            </button>
            <button class="btn btn-gray" onclick="openSettings()">
                <i class="fas fa-folder-open"></i> Kelola Fanpage
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')" id="tab-btn-pending">
            <i class="fas fa-clipboard-list"></i> Antrean (<span id="count-pending">0</span>)
        </button>
        <button class="tab-btn" onclick="switchTab('completed')" id="tab-btn-completed">
            <i class="fas fa-check-square"></i> Selesai (<span id="count-completed">0</span>)
        </button>
    </div>

    <!-- Tab Pending -->
    <div id="tab-pending" class="tab-content active">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="50%">Detail Konten & Atribut Afiliasi</th>
                        <th width="15%">Status</th>
                        <th width="25%">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body-pending">
                    <tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tab Completed -->
    <div id="tab-completed" class="tab-content">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="50%">Detail Konten & Atribut Afiliasi</th>
                        <th width="15%">Status</th>
                        <th width="25%">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body-completed">
                    <tr><td colspan="4" style="text-align: center;">Belum ada video selesai.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ================= MODALS / OVERLAYS ================= -->

<!-- 1. Modal Upload & Jadwal -->
<div id="uploadModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('uploadModal')">&times;</span>
        <h2 style="color: var(--btn-upload); margin-top:0;"><i class="fas fa-rocket"></i> Atur Upload Video</h2>
        <input type="hidden" id="upload_video_id">
        <div class="form-group" style="margin-top: 15px;">
            <label><i class="fas fa-calendar-alt"></i> Setel Jadwal (Opsional):</label>
            <input type="datetime-local" id="schedule_time">
            <small style="color: #7f8c8d; font-size: 11px;">Biarkan kosong jika ingin upload sekarang.</small>
        </div>
        <div class="flex-buttons">
            <button class="btn btn-gray" onclick="saveSchedule()">
                <i class="fas fa-save"></i> Simpan Jadwal
            </button>
            <button class="btn btn-upload-action" onclick="triggerUploadNow()">
                <i class="fas fa-upload"></i> Upload Sekarang
            </button>
        </div>
    </div>
</div>

<!-- 2. Modal Edit Video -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('editModal')">&times;</span>
        <h2 style="color: var(--btn-edit); margin-top:0;"><i class="fas fa-edit"></i> Edit Detail Video</h2>
        <input type="hidden" id="edit_video_id">
        <div class="form-group">
            <label>Judul Video:</label>
            <input type="text" id="edit_title">
        </div>
        <div class="form-group">
            <label>Deskripsi / Caption:</label>
            <textarea id="edit_desc" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Link Afiliasi:</label>
            <input type="text" id="edit_link">
        </div>
        <button class="btn btn-edit-action" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="saveEdit()">
            <i class="fas fa-save"></i> Simpan Perubahan
        </button>
    </div>
</div>

<!-- 3. Modal Settings -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal('settingsModal')">&times;</span>
        <h2><i class="fas fa-cogs"></i> Pengaturan Sistem</h2>
        <div class="form-group">
            <label>GitHub Personal Access Token (PAT):</label>
            <input type="password" id="gh_token">
        </div>
        <div class="form-group">
            <label>Nama Repositori (contoh: user/repo):</label>
            <input type="text" id="gh_repo">
        </div>
        <button class="btn btn-green" style="width: 100%; justify-content: center;" onclick="saveSettings()">
            <i class="fas fa-save"></i> Simpan
        </button>
    </div>
</div>

<script>
    // Tab Switching
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`tab-btn-${tabId}`).classList.add('active');
    }

    // Modal Global Functions
    function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

    function openSettings() {
        document.getElementById('gh_token').value = localStorage.getItem('gh_token') || '';
        document.getElementById('gh_repo').value = localStorage.getItem('gh_repo') || '';
        openModal('settingsModal');
    }

    function saveSettings() {
        const token = document.getElementById('gh_token').value;
        const repo = document.getElementById('gh_repo').value;
        if(token && repo) {
            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_repo', repo);
            checkConnection();
            closeModal('settingsModal');
        } else { alert('Harap isi Token dan Repo!'); }
    }

    function checkConnection() {
        const token = localStorage.getItem('gh_token');
        const repo = localStorage.getItem('gh_repo');
        const statusEl = document.getElementById('conn_status');
        if(token && repo) {
            statusEl.className = 'status-indicator status-connected';
            statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Terhubung';
            loadData();
        } else {
            statusEl.className = 'status-indicator status-disconnected';
            statusEl.innerHTML = '<i class="fas fa-times-circle"></i> Token Belum Diatur';
        }
    }

    // Load Data & Render
    let videoData = [];
    function loadData() {
        fetch(`videos.json?t=${new Date().getTime()}`)
            .then(res => res.json())
            .then(data => { videoData = data; renderTables(); })
            .catch(err => {
                document.getElementById('table-body-pending').innerHTML = `<tr><td colspan="4">Gagal memuat: ${err.message}</td></tr>`;
            });
    }

    function renderTables() {
        const tbodyPending = document.getElementById('table-body-pending');
        const tbodyCompleted = document.getElementById('table-body-completed');
        let pHTML = '', cHTML = '';
        let countP = 0, countC = 0;

        [...videoData].reverse().forEach(video => {
            // Tampilan Status Overlay di bawah Judul
            let statusOverlayHTML = '';
            if (video.status === 'pending') {
                statusOverlayHTML = `<div class="video-meta meta-status-pending"><i class="fas fa-clock"></i> Status: Otomatis</div>`;
            } else {
                statusOverlayHTML = `<div class="video-meta meta-status-completed"><i class="fas fa-check-square"></i> Terunggah ke Facebook</div>`;
            }

            const rowHTML = `
                <tr>
                    <td><strong>#${video.id}</strong></td>
                    <td>
                        <div class="video-info">
                            <img src="${video.thumbnail || 'https://via.placeholder.com/80?text=Video'}" class="video-thumbnail">
                            <div class="video-details">
                                <h3>${video.title || 'Video Tanpa Judul'}</h3>
                                ${statusOverlayHTML}
                                <div class="video-meta meta-desc"><i class="fas fa-edit"></i> ${video.description ? video.description.substring(0, 30) + '...' : 'Tidak ada deskripsi'}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="status-badge badge-${video.status}">${video.status === 'pending' ? 'Pending' : 'Selesai'}</span></td>
                    <td>
                        <div class="action-cell">
                        ${video.status === 'pending' ? `
                            <button class="btn btn-sm btn-edit-action" onclick="openEditVideo('${video.id}')">
                                Edit
                            </button>
                            <button class="btn btn-sm btn-upload-action" onclick="openUploadVideo('${video.id}')" id="btn-up-${video.id}">
                                Upload
                            </button>
                            <button class="btn btn-sm btn-hapus-action" onclick="deleteVideo('${video.id}')">
                                Hapus
                            </button>
                        ` : `
                            <span style="color:#7f8c8d; font-size:12px;"><i class="fas fa-archive"></i> Arsip Selesai</span>
                        `}
                        </div>
                    </td>
                </tr>
            `;

            if(video.status === 'pending') { pHTML += rowHTML; countP++; } 
            else { cHTML += rowHTML; countC++; }
        });

        document.getElementById('count-pending').innerText = countP;
        document.getElementById('count-completed').innerText = countC;
        tbodyPending.innerHTML = pHTML || `<tr><td colspan="4" align="center">Antrean kosong.</td></tr>`;
        tbodyCompleted.innerHTML = cHTML || `<tr><td colspan="4" align="center">Belum ada video selesai.</td></tr>`;
    }

    // Aksi Tombol Edit
    function openEditVideo(id) {
        const vid = videoData.find(v => String(v.id) === String(id));
        if(vid) {
            document.getElementById('edit_video_id').value = vid.id;
            document.getElementById('edit_title').value = vid.title || '';
            document.getElementById('edit_desc').value = vid.description || '';
            document.getElementById('edit_link').value = vid.redirect_link || '';
            openModal('editModal');
        }
    }

    function saveEdit() {
        alert('Perubahan disimpan di frontend! (Untuk simpan permanen, diperlukan integrasi API penulisan ke GitHub).');
        closeModal('editModal');
    }

    // Aksi Tombol Upload (Membuka Modal)
    function openUploadVideo(id) {
        document.getElementById('upload_video_id').value = id;
        document.getElementById('schedule_time').value = ''; // Reset jadwal
        openModal('uploadModal');
    }

    function saveSchedule() {
        const time = document.getElementById('schedule_time').value;
        if(!time) { alert('Pilih waktu jadwal terlebih dahulu!'); return; }
        alert('Jadwal berhasil disetel ke: ' + time + ' (Sistem akan mengupload otomatis pada jam tersebut)');
        closeModal('uploadModal');
    }

    // Eksekusi Upload Instan & Animasi Spinner
    function triggerUploadNow() {
        const videoId = document.getElementById('upload_video_id').value;
        closeModal('uploadModal'); // Tutup modal

        const uploadBtn = document.getElementById(`btn-up-${videoId}`);
        const originalBtnText = uploadBtn.innerHTML;

        // Ubah tampilan tombol di tabel
        uploadBtn.innerHTML = '<span class="loader-spinner"></span> Mengunggah...';
        uploadBtn.classList.add('btn-uploading');

        const token = localStorage.getItem('gh_token');
        const repo = localStorage.getItem('gh_repo');

        if (!token || !repo) {
            alert('Token belum lengkap!');
            uploadBtn.innerHTML = originalBtnText; uploadBtn.classList.remove('btn-uploading');
            return;
        }

        const payload = {
            event_type: "upload_now",
            client_payload: { command: "upload_now", video_id: videoId }
        };

        fetch(`https://api.github.com/repos/${repo}/dispatches`, {
            method: 'POST',
            headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${token}` },
            body: JSON.stringify(payload)
        }).then(res => {
            if(res.ok) {
                // Polling cek status real-time
                checkUploadStatus(videoId, uploadBtn, originalBtnText);
            } else {
                alert('Gagal mengirim perintah ke GitHub.');
                uploadBtn.innerHTML = originalBtnText; uploadBtn.classList.remove('btn-uploading');
            }
        });
    }

    // Polling Status
    function checkUploadStatus(videoId, uploadBtn, originalBtnText) {
        const maxAttempts = 24; let attempts = 0;
        const checkInterval = setInterval(() => {
            attempts++;
            fetch(`videos.json?t=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    const targetVideo = data.find(v => String(v.id) === String(videoId));
                    if (targetVideo && targetVideo.status === 'completed') {
                        clearInterval(checkInterval);
                        uploadBtn.innerHTML = '✅ Selesai';
                        uploadBtn.classList.remove('btn-uploading');
                        uploadBtn.style.backgroundColor = '#27ae60';
                        setTimeout(() => loadData(), 1500); // Pindah otomatis
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        uploadBtn.innerHTML = '⚠️ Timeout';
                        uploadBtn.classList.remove('btn-uploading');
                        alert('Proses terlalu lama. Cek log GitHub Actions.');
                    }
                }).catch(e => console.error(e));
        }, 15000); // 15 detik
    }

    function syncTelegram() {
        if(confirm('Tarik video baru dari Telegram?')) alert('Mensinkronkan Telegram... Silakan muat ulang halaman sebentar lagi.');
    }
    
    function deleteVideo(id) {
        if(confirm('Hapus video ini?')) { videoData = videoData.filter(v => String(v.id) !== String(id)); renderTables(); }
    }

    window.onload = checkConnection;
</script>

</body>
    </html>
