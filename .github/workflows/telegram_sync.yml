
name: Telegram Sync Worker

on:
  repository_dispatch:
    types: [sync_only]
  workflow_dispatch: # Mengizinkan pemicu manual dari GitHub

permissions:
  contents: write

jobs:
  sync-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Telegram Sync Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python telegram_sync.py

      - name: Commit and Push New Pending Videos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Auto-sync: Menambahkan video baru dari Telegram (Pending)" || echo "Tidak ada perubahan."
          git push
