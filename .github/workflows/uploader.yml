name: Facebook Auto Uploader

on:
  schedule:
    # Berjalan otomatis 3 kali sehari (Pukul 12:00, 17:00, dan 20:00 WIB)
    # Dikonversi ke waktu UTC (WIB dikurangi 7 jam): 05:00, 10:00, 13:00 UTC
    - cron: '0 5,10,13 * * *'
    
  workflow_dispatch:
  repository_dispatch:
    types: [instant_upload]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gdown

      - name: Run Upload Script
        run: python upload.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git stash
          git pull origin main --rebase
          git stash pop || true
          git add videos.json
          git commit -m "Auto-update status video setelah unggah" || exit 0
          git push origin main
