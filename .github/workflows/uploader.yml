name: Facebook Auto Uploader

on:
  schedule:
    - cron: '0 * * * *'
    
  workflow_dispatch:
  repository_dispatch:
    types: [instant_upload]

permissions:
  contents: write

jobs:
  sync_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests gdown

      - name: Run Telegram Sync (Hanya jika bukan perintah Upload Instan)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -c "
          import os, json
          event_path = os.environ.get('GITHUB_EVENT_PATH', '')
          is_upload_now = False
          if event_path and os.path.exists(event_path):
              with open(event_path, 'r') as f:
                  data = json.load(f)
                  if data.get('client_payload', {}).get('command') == 'upload_now':
                      is_upload_now = True
          if not is_upload_now:
              import subprocess
              subprocess.run(['python', 'telegram_sync.py'])
          else:
              print('Mode Upload Sekarang Aktif: Sinkronisasi Telegram dilewati agar antrean aman.')
          "

      - name: Run Upload Script
        run: python upload.py

      - name: Commit and Push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync queue from Telegram & process uploads"
          git push origin main || true
