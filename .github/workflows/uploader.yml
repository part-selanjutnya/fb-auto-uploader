name: Facebook Auto Uploader

on:
  schedule:
    # Sinkronisasi Telegram otomatis setiap jam, agar video langsung masuk antrean web
    - cron: '0 * * * *'
    
  workflow_dispatch:
  repository_dispatch:
    types: [instant_upload]

permissions:
  contents: write

jobs:
  sync_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests gdown

      # 1. Jalankan sinkronisasi Telegram untuk menangkap video baru & memasukkannya ke antrean pending
      - name: Sync Video from Telegram to Queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_sync.py

      # 2. Jalankan skrip upload (hanya akan mengeksekusi jika ada jadwal jam cron yang cocok atau via tombol Instant Upload)
      - name: Run Upload Script if Scheduled or Triggered
        run: python upload.py

      - name: Commit and Push changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git stash
          git pull origin main --rebase
          git stash pop || true
          git add videos.json
          git commit -m "Auto-sync queue from Telegram & process uploads" || exit 0
          git push origin main
