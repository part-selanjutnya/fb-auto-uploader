name: Facebook Auto Uploader

on:
  schedule:
    # Berjalan 10 kali sehari (04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 WIB)
    - cron: '0 21,23,1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch: # Tombol pemicu manual

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gdown

      - name: Run Upload Script
        env:
          FB_PAGES_DATA: ${{ secrets.FB_PAGES_DATA }}
        run: python upload.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update status video setelah unggah"
