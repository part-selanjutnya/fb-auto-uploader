name: Facebook Auto Uploader

on:
  schedule:
    - cron: '0 * * * *'
    
  workflow_dispatch:
  repository_dispatch:
    types: [instant_upload]

permissions:
  contents: write

jobs:
  sync_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests gdown

      - name: Sync Video from Telegram to Queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_sync.py

      - name: Run Upload Script if Scheduled or Triggered
        run: python upload.py

      - name: Commit and Push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync queue from Telegram & process uploads"
          git push origin main || true
