name: Auto Direct Upload Facebook Reels

on:
  schedule:
    # Eksekusi setiap 2 jam (04:00 - 22:00 WIB)
    - cron: '0 21,23,1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Run Upload Script
        env:
          FB_PAGES_DATA: ${{ secrets.FB_PAGES_DATA }}
        run: python upload.py

      - name: Commit & Push Updated links.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add links.txt
          git commit -m "Update links.txt status" || exit 0
          git push
