name: Auto Moderate and Check Copyright

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali (atau bisa Anda sesuaikan)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  moderate-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run copyright check and auto-delete
        env:
          FB_PAGES_DATA: ${{ secrets.FB_PAGES_DATA }}
        run: |
          python check_violations.py

      - name: Commit and push report changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add report.json
          git commit -m "chore: update copyright moderation report [skip ci]" || echo "No changes to commit"
          git push
